name: Build unsigned IPA
on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mobile web bundle + cap sync (runs pod install)
        working-directory: frontend
        run: |
          npm ci
          npm run build:mobile

      - name: Archive (unsigned)
        working-directory: frontend/ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -60

      - name: Package IPA
        working-directory: frontend/ios/App
        run: |
          APP=build/App.xcarchive/Products/Applications/App.app
          test -d "$APP"
          plutil -p "$APP/Info.plist" | grep -E "CFBundle(Identifier|ShortVersionString|DisplayName)|MinimumOS|Usage"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "$GITHUB_WORKSPACE/openGym.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/openGym.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: openGym-ipa
          path: openGym.ipa
